# Atuin PVC — manage separately from the deployment to ensure data persistence.
# Create ONCE before deploying atuin_server.yaml.
#
# db-nvme-storage uses WaitForFirstConsumer — the PV is not provisioned until
# the deployment is applied. Node placement is handled automatically.
#
# Create:  kubectl apply -f atuin_pvc.yaml
# Check:   kubectl get pvc atuin-data
# Delete:  kubectl delete pvc atuin-data  ← WARNING: destroys all data

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atuin-data
  labels:
    app: atuin
spec:
  storageClassName: db-nvme-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
